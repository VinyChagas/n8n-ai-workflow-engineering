[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-ai-workflow-engineering"
version = "0.1.0"
description = "Agent-agnostic engineering core and CLI for safe n8n workflow-as-code."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
n8n-workflow-manager = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "config*", "deployment*", "validation*"]
